# Inventory for running deploy/dhm-deploy.yml ON the target host itself.
#
# The playbook says `hosts: dhm_runners`; Ansible only runs it against hosts in a group
# of that name. With no such group it prints "skipping: no hosts matched" and exits
# successfully having done nothing, which is easy to mistake for a pass.
#
#   ansible-playbook -i deploy/inventory.local.ini deploy/dhm-deploy.yml --check --diff
#
# To deploy to another machine over SSH instead, copy this and replace the line below
# with e.g.:   dhm-host.example.gov ansible_user=ec2-user
[dhm_runners]
localhost ansible_connection=local
