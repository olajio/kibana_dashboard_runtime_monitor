# Dashboard Health & Load-Time Monitor — settings
#
# Copy this file to config/settings.yaml and fill in the real values.
# settings.yaml is git-ignored so no secrets land in the repo.
#
# Every value can also be supplied via an environment variable (shown in
# brackets); the environment variable wins when both are set. This lets us
# keep secrets out of the file entirely in CI/cron.

# --- What we are monitoring -------------------------------------------------
# One cluster, one Kibana space. These are recorded on every document so the
# trend dashboard and alerts can filter, even though today there is one value.
app: federal_overview          # logical label for this dashboard family (also used to
                                # auto-detect the "Federal Overview" hub); not the space
cluster: fed2                   # [DHM_CLUSTER] the single cluster we monitor
# The Kibana space ID (the URL slug in /s/<id>/...), NOT the display name.
# fed2 is the built-in default in code — the space our dashboards live in — so
# this only needs changing if a cluster puts them elsewhere. Override per
# environment with DHM_SPACE. Confirm by reading the /s/<id> segment in the
# dashboard URL. ("default" is the one space Kibana serves with no /s/ prefix.)
kibana_space: fed2              # [DHM_SPACE] space ID the dashboards live in

# --- AWS Secrets Manager ----------------------------------------------------
# How production is configured. Ansible deploys this repo to the server and sets
# `aws_secret_id` (or DHM_AWS_SECRET_ID); nothing else environment-specific and
# nothing sensitive needs to live on the server.
#
# `aws_secret_id` names ONE secret whose payload is a JSON object holding the
# connection settings. These are the field names our production secret uses:
#
#     {
#       "kibana_url":                   "https://kibana.example.gov:9243",
#       "elastic_url":                  "https://es.example.gov:9243",
#       "ans_dashboard_health_monitor": "<base64 id:key>",
#       "kibana_api_key":               "<base64 id:key>"   # optional; defaults to the above
#     }
#
# Precedence for the two URLs, most explicit first:
#   --kibana-url / --es-url  >  this bundle  >  the literal values in this file
# There is deliberately NO environment variable for the URLs: the endpoints
# belong to the secret, and an env var that outranked it would let a stale
# export in a shell or crontab quietly redirect the whole run.
#
# Precedence for the API keys (these DO keep an env step, because passing the
# key by hand is how the test environment runs):
#   CLI flag  >  env var  >  this bundle  >  value-specific secret
#           >  the literal value in this file
#
# The bundle deliberately outranks this file: the file carries per-environment
# defaults, the secret is the source of truth. Configure either the bundle or
# the value-specific secrets below, not both.
#
# Leave aws_secret_id empty (the test default) and AWS is never contacted.
aws_region: us-east-1           # [DHM_AWS_REGION] our default; AWS_REGION also honoured
aws_secret_id: ""               # [DHM_AWS_SECRET_ID] e.g. elastic/dhm/connection
# Field names inside the bundle. Change these only if the secret uses other names;
# a few common spellings (es_url, api_key, elasticsearch_url, ...) are also
# accepted automatically, case-insensitively.
aws_secret_keys:
  kibana_url: kibana_url
  es_url: elastic_url
  api_key: ans_dashboard_health_monitor
  kibana_api_key: kibana_api_key

# --- Kibana (the browser target) --------------------------------------------
kibana:
  # Test: set it here. Production: leave it and let the AWS bundle supply it.
  # No env-var override by design — see the aws_secret_keys note above.
  base_url: https://kibana.example.gov      # no trailing slash
  # Authentication for the headless browser. Choose ONE method.
  #   api_key : injected as an "Authorization: ApiKey <key>" header
  #   cookie  : a pre-obtained Kibana session cookie (name + value)
  auth:
    method: api_key                          # api_key | cookie
    api_key: ""                              # [DHM_KIBANA_API_KEY] base64 id:key
    cookie_name: sid
    cookie_value: ""                         # [DHM_KIBANA_COOKIE]
    # Optional: a SEPARATE secret holding only the Kibana API key, for split-secret
    # setups. Normally unnecessary — the top-level bundle's kibana_api_key (or, if
    # absent, its api_key) covers this, and an empty value falls back to the
    # Elasticsearch key below.
    aws_secret_id: ""                        # [DHM_KIBANA_AWS_SECRET_ID]
    aws_secret_json_key: api_key             # field name if the secret is JSON
  # Time range applied to every dashboard load (Kibana global state).
  # Match this to the window the team reviews manually. now-30d suits a monthly
  # review; heavier windows pull more data so tune dashboard_timeout_ms if needed.
  time_from: now-30d
  time_to: now
  verify_tls: true                           # [DHM_KIBANA_VERIFY_TLS] false only for lab

# --- Elasticsearch (where results are written) ------------------------------
elasticsearch:
  # NOTE: this is a different host from kibana.base_url (typically ...es... vs
  # ...kb...). Pointing both at Kibana makes every _bulk write 404 — the
  # collector warns when it sees them match.
  # Test: set it here. Production: leave it and let the AWS bundle supply it.
  # No env-var override by design — see the aws_secret_keys note above.
  base_url: https://es.example.gov:9200
  # Resolution order: --es-api-key > DHM_ES_API_KEY > the top-level AWS bundle
  # > the value-specific secret below > this literal value.
  api_key: ""                                # [DHM_ES_API_KEY] base64 id:key
  # Optional: a SEPARATE secret holding only the ES API key, for split-secret
  # setups. Normally unnecessary — use the top-level aws_secret_id bundle.
  aws_secret_id: ""                          # [DHM_ES_AWS_SECRET_ID] e.g. elastic/kibana/dhm-es
  aws_secret_json_key: api_key               # field name if the secret is JSON
  # Data-stream name. NOT dot-prefixed: Kibana hides dot-prefixed streams from
  # the data-view picker (system indices), and some ES setups refuse to let
  # non-system users create them. If a `.dashboard-health-monitor` stream was
  # created by a previous version, delete it first (see the HOWTO).
  index: dashboard-health-monitor
  verify_tls: true                           # [DHM_ES_VERIFY_TLS] false only for lab
  # Operational limits for ES REST calls.
  request_timeout_s: 30                      # per-request timeout
  max_retries: 4                             # retries on 429/5xx/connection errors
  retry_backoff_s: 2.0                       # base for exponential backoff
  bulk_chunk_size: 500                       # docs per _bulk request

# --- Collector behaviour ----------------------------------------------------
collector:
  # Where the list of dashboards to monitor comes from:
  #   export - read the generated file below (built from a .ndjson). A static
  #            snapshot; good for test / offline runs.
  #   api    - query Kibana's Saved Objects API live on every run. Always reflects
  #            production (new/removed/renamed dashboards & panels picked up
  #            automatically); needs no export file on the server. Use this in prod.
  registry_source: export          # [DHM_REGISTRY_SOURCE] export | api
  registry_path: config/dashboards.generated.json   # used when registry_source=export
  # How we choose which dashboards to monitor (applies to both registry sources):
  #   linked (default) - the hub (hub_title) plus every dashboard reachable from its
  #                      navigation: the Federal Overview dashboard and all the
  #                      dashboards linked to it (found by following its Links panels
  #                      and drilldowns). Adapts automatically if the nav changes.
  #   titles           - exactly the dashboards named in include_titles.
  #   all              - every dashboard in the space.
  selection: linked                # [DHM_SELECTION] linked | titles | all
  hub_title: "Federal Overview"    # [DHM_HUB_TITLE] starting dashboard for 'linked'
  include_titles: []               # [DHM_INCLUDE_TITLES] used only when selection=titles
  headless: true
  # Automation backend:
  #   playwright - default
  #   selenium   - fallback when the playwright pip package can't be installed
  #                (needs: pip install -r requirements-selenium.txt)
  backend: playwright              # [DHM_BACKEND]
  # Which browser to drive. Use an already-installed browser so nothing has to
  # be downloaded:
  #   msedge   - system Microsoft Edge (default; the prod environment's browser)
  #   chrome   - system Google Chrome (e.g. the test environment)
  #   chromium - Playwright's own downloaded Chromium (playwright backend only;
  #              needs `playwright install`)
  browser_channel: msedge          # [DHM_BROWSER_CHANNEL]
  # Selenium backend only: path to msedgedriver/chromedriver.
  # Empty -> found on PATH or via Selenium Manager.
  webdriver_path: ""               # [DHM_WEBDRIVER_PATH]
  # Per-dashboard hard cap. A dashboard that has not finished by this point is
  # recorded as load_status=failed and its unrendered panels as timeout. Sized
  # for prod with time_from=now-30d and heavy dashboards (e.g. Priority Risks,
  # 35 panels); raise if some dashboards still hit the cap.
  dashboard_timeout_ms: 180000
  # How often we poll the page for per-panel render progress.
  poll_interval_ms: 250
  # How many dashboards to load concurrently. Start at 1; raise only after
  # measuring browser memory on the runner.
  concurrency: 1
  # Load-time classification (dashboard level). Baselines refine this later.
  degraded_over_ms: 30000
  failed_over_ms: 120000
  # A dashboard is 'failed' when the share of not-ok panels reaches this pct
  # (0-100). Below it, any not-ok panel makes the dashboard 'degraded'. Panels
  # with a Kibana error state always mark the dashboard failed regardless.
  # 0   = ANY not-ok panel is a failure
  # 50  = default; more than half not-ok is a failure
  # 101 = disable the threshold entirely (use only load-time + error signals)
  failed_not_ok_pct: 50.0
  # Politeness: pause between dashboard loads so we do not hammer Kibana.
  inter_request_delay_ms: 500
  # Retry a dashboard this many extra times if the initial navigation fails.
  load_retries: 1
